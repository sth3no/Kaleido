[package]
name = "kaleido"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "kaleido"

[[bin]]
name = "Kaleido"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
# 2.5.4 is the newest 2.x (checked 2026-10-18; only 3.0.0 alphas are newer). The Windows startup
# race fixed after it (spec 9.3) is checked by hand: docs/m1/checklist.md, "Jediná instance".
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2"
anyhow = "1"
mpv-ffi = { path = "../crates/mpv-ffi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 of the files Kaleido pins by checksum: every file a plugin install puts in place
# (plugins/install.rs), and the downloads of yt-dlp and Deno (tools/checksum.rs). Already in the
# build through tauri.
sha2 = "0.10"
# The system's language for the "system" language setting (system_locale in commands.rs).
sys-locale = "0.3.2"
# The dates of the archived mpv logs, and the `installedAt` of plugins.json (RFC 3339);
# tracing-appender uses it too.
time = { version = "0.3", features = ["formatting", "parsing"] }
tracing = "0.1"
# kaleido.<date>.log: one file a day, the last seven.
tracing-appender = "0.2.3"
# Plain text lines (no colours) and the `log` records of the crates that do not use tracing.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "tracing-log"] }
# The downloads of yt-dlp and Deno from GitHub Releases (tools/http.rs). TLS through native-tls,
# which is schannel on Windows with the system's root certificates: no rustls, so no ring or
# aws-lc-rs and the C build tools they need, and no root bundle of its own (webpki-root-certs is
# CDLA-Permissive-2.0, a license not on the accepted list). `native-tls-no-default` is the
# feature for that (the README calls it unstable, so a newer ureq may rename it); ureq 3.5.0 is
# the first where it also brings the TLS connector: in 3.4 every https request panicked
# (`tools::http` test `https_goes_through_native_tls`). No gzip: release assets are not sent
# compressed.
ureq = { version = "3.5.0", default-features = false, features = ["native-tls-no-default"] }
url = "2"
# deno.exe out of Deno's release zip (tools/mod.rs). Deflate only, through flate2 (in the build
# through Tauri already) with zlib-rs, which is pure Rust (flate2 then inflates with it for
# Tauri's images too): no bzip2, zstd, lzma or AES.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The version wry uses, so that its WebView2 interfaces are the ones Tauri hands out.
webview2-com = "0.39"
windows = { version = "0.62", features = [
  # The Windows build for the diagnostics: RtlGetVersion is not changed by the manifest.
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Globalization",
  # The system font families for the subtitle font setting.
  "Win32_Graphics_DirectWrite",
  # The graphics adapters for the diagnostics.
  "Win32_Graphics_Dxgi",
  "Win32_Security",
  "Win32_System_JobObjects",
  # Windows' transparency switch for the appearance (themes.rs).
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  # The high-contrast flag for the appearance (themes.rs).
  "Win32_UI_Accessibility",
  # TrackMouseEvent for the window over the maximise button (surface/win32.rs); tao has it too.
  "Win32_UI_Input_KeyboardAndMouse",
  # SHFileOperationW: an uninstalled plugin goes to the Recycle Bin (plugins/recycle.rs).
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
# The surface tests create their own windows.
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
