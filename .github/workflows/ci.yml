name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch pinned libmpv and thumbfast
        shell: pwsh
        run: |
          ./scripts/fetch-libmpv.ps1
          ./scripts/fetch-thumbfast.ps1
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy -p mpv-ffi -p kaleido-mpv --all-targets -- -D warnings
      - run: cargo test -p mpv-ffi -p kaleido-mpv

  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # tauri-build needs the bundled thumbfast.lua; the libmpv tests of later tasks need the DLL.
      - name: Fetch pinned libmpv and thumbfast
        shell: pwsh
        run: |
          ./scripts/fetch-libmpv.ps1
          ./scripts/fetch-thumbfast.ps1
      - run: rustup component add clippy
      - run: cargo clippy -p kaleido --all-targets -- -D warnings
      - run: cargo test -p kaleido

  # The license list in the "About" page is generated from Cargo.lock and the UI's packages and
  # committed (spec 11.6): a changed dependency must come with a changed list.
  licenses:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # license-checker reads the installed packages.
      - run: npm ci
      # The version the list was generated with: another one may word a license differently.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Regenerate the license list
        shell: pwsh
        run: ./scripts/generate-licenses.ps1
      - name: Fail when the committed list is out of date
        run: git diff --exit-code resources/licenses

  # Goes away with the prototype (Task 24).
  prototype:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v5
      # kaleido-proto tests drive the real libmpv: open_requests, and the mpv window class the
      # surface relies on (vo=gpu-next/d3d11; runners without a GPU fall back to WARP).
      - name: Fetch pinned libmpv
        shell: pwsh
        working-directory: .
        run: ./scripts/fetch-libmpv.ps1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo clippy -p kaleido-proto --all-targets -- -D warnings
      - run: cargo test -p kaleido-proto
