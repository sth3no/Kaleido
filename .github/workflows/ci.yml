name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch pinned libmpv and thumbfast
        shell: pwsh
        run: |
          ./scripts/fetch-libmpv.ps1
          ./scripts/fetch-thumbfast.ps1
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy -p mpv-ffi -p kaleido-mpv --all-targets -- -D warnings
      - run: cargo test -p mpv-ffi -p kaleido-mpv

  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # tauri-build needs the bundled thumbfast.lua; the libmpv tests of later tasks need the DLL.
      - name: Fetch pinned libmpv and thumbfast
        shell: pwsh
        run: |
          ./scripts/fetch-libmpv.ps1
          ./scripts/fetch-thumbfast.ps1
      - run: rustup component add clippy
      - run: cargo clippy -p kaleido --all-targets -- -D warnings
      - run: cargo test -p kaleido

  # The license list in the "About" page is generated from Cargo.lock and the UI's packages and
  # committed (spec 11.6): a changed dependency must come with a changed list.
  licenses:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # license-checker reads the installed packages.
      - run: npm ci
      # The version the list was generated with: another one may word a license differently.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Regenerate the license list
        shell: pwsh
        run: ./scripts/generate-licenses.ps1
      - name: Fail when the committed list is out of date
        run: git diff --exit-code resources/licenses

  # The smoke E2E (e2e/): the debug app with the UI inside plays a generated clip under
  # WebdriverIO, through tauri-driver and the msedgedriver of the runner's WebView2 (the versions
  # must match). Runners without a GPU play it through WARP.
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch pinned libmpv and thumbfast
        shell: pwsh
        run: |
          ./scripts/fetch-libmpv.ps1
          ./scripts/fetch-thumbfast.ps1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo install tauri-driver --locked --version 2.1.0
      - name: Fetch the msedgedriver of the runner's WebView2
        shell: pwsh
        run: ./e2e/fetch-driver.ps1
      # kaleido-mpv, `tauri build --debug --no-bundle` (target/debug/Kaleido.exe) and the clip.
      - run: npm run e2e:build
      - run: npm run e2e
